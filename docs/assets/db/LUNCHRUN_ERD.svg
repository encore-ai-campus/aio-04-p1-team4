<text x="20" y="960" font-size="19" fill="#607188">화살표: 부모 → 자식　　PK: 기본키　 FK: 외래키　 UK: 고유 제약</text>
<text x="20" y="997" font-size="19" fill="#607188">0..1: 연결되지 않을 수 있음　 0..N: 연결된 자식 행이 없거나 여러 개</text>
