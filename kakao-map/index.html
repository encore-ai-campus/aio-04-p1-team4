<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUNCH RUN · 식당 지도</title>
<style>#kakao-map{position:absolute;inset:0}.backend-map-pin{border:2px solid white;border-radius:20px;padding:9px 12px;color:white;font-weight:700;box-shadow:0 3px 10px #0003}.map-hint{max-width:85%;white-space:normal}#selected-card[hidden]{display:none}#map-budget{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px}.map-links{display:flex;gap:14px;margin:12px 0;font-size:13px}.overlap-count{min-width:50px}#selected-card{max-height:70vh;overflow:auto}#selected-card section{border-top:1px solid #e6e8df;margin-top:12px;padding-top:12px}#selected-card section button{margin:4px;padding:7px;border:1px solid #ddd;border-radius:7px;background:#fff}#selected-card section a{font-size:12px}.random:disabled{opacity:.5;cursor:not-allowed}#search-again,#change-location{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:9px;background:white}#map-conditions button{padding:8px;margin:8px 0;border:1px solid #ddd;border-radius:8px}#kakao-map{min-height:620px}</style>
<link rel="stylesheet" href="styles.css?v=2"><link rel="stylesheet" href="/static/location-picker.css">
</head><body>
<header><a class="brand" href="/"><span class="brand-icon">↗</span>LUNCH RUN<span class="brand-dot">.</span></a><span class="header-note">점심을 고르는 가벼운 방법</span><span class="example-tag">KAKAO MAP</span></header>
<main><aside><div class="intro"><p class="eyebrow">오늘의 점심 탐색</p><h1>오늘 점심,<br>지도에서 골라요<span>.</span></h1><p class="intro-copy">목록이나 핀을 눌러 식당 정보를 확인하세요.</p>
<div class="location" id="search-location"></div><button id="precise-location" type="button">◎ 내 위치 정밀 확인</button><button id="map-center-search" type="button">이 지도 중심으로 검색</button><button id="change-location" type="button">⌖ 출발 위치 변경</button>
<div class="radius-control"><div class="radius-control-heading"><label for="search-radius">검색 반경</label><output id="radius-value"></output></div><button id="radius-less" type="button" aria-label="반경 줄이기">−</button><button id="radius-more" type="button" aria-label="반경 늘리기">＋</button><input id="search-radius" type="range" min="50" max="500" step="50"></div>
<form id="map-conditions"><label for="map-budget">한 끼 예산</label><input id="map-budget" type="number" min="1000" max="100000" step="1" required><div class="cuisine-control"><label for="cuisine-filter">음식 종류</label><select id="cuisine-filter"></select></div><button type="submit">조건 적용 후 재검색</button></form>
<button id="search-again" type="button">같은 조건으로 다시 검색</button><p id="search-status" class="search-status" role="status" aria-live="polite">위치와 메뉴를 확인해주세요.</p>
<button id="random" class="random" type="button">검증된 추천에서 뽑기 ↗</button><button id="catalog-open" type="button" class="catalog-link">DB 전체 메뉴 검색 ↗</button><nav class="map-links"><a href="/games/" data-action="back-game">메뉴 다시 고르기</a><a href="/">조건 설정으로</a></nav></div>
<div class="list-heading"><h2 id="list-title"></h2><span id="count"></span></div><div id="restaurant-list" class="restaurant-list"></div>
<p class="data-note">카카오 검색과 백엔드 DB·상세정보 검증 결과입니다. 거리는 직선 기준이며, 조회 이후 가격·영업 상태는 달라질 수 있습니다. 확인 필요 후보는 추첨에서 제외합니다.</p>
</aside><section class="map-section" aria-label="지도와 식당 핀"><div class="map-topbar"><span id="mode-label"><i></i> 카카오 지도 · 실제 좌표</span><button id="setup-open" type="button">지도 다시 연결</button></div>
<div id="map" class="map"><div id="kakao-map"></div><div class="map-hint" id="map-hint" role="status">카카오 지도를 연결하고 있어요…</div><div id="selected-card" class="selected-card" aria-live="polite" hidden></div></div>
<footer><span>목록과 마커가 같은 식당을 표시합니다.</span><span>SELECT YOUR NEXT LUNCH ↗</span></footer></section></main>
<script src="/static/state.js"></script><script src="/static/location.js"></script><script src="/static/location-picker.js"></script>
<script>for(const name of ['전체','한식','중식','일식/회','양식','분식','패스트푸드','치킨','도시락/구내식당','뷔페식','냉면','고기','카페/빵','술집','기타']){const option=document.createElement('option');option.value=name;option.textContent=name;document.getElementById('cuisine-filter').append(option);}</script><script src="geolocation-diagnostics.js"></script><script src="routes.js"></script><script src="pin-overlaps.js"></script><script src="integration.js"></script></body></html>
